databaseChangeLog:
  - changeSet:
      id: 014-01-create-sangria
      author: extensao-restaurante-2026
      comment: Cria a tabela de sangrias (retiradas de dinheiro) do caixa.
      changes:
        - createTable:
            tableName: sangria
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_sangria
                    nullable: false
              - column:
                  name: sessao_caixa_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: valor
                  type: NUMERIC(18,2)
                  constraints:
                    nullable: false
              - column:
                  name: motivo
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: usuario_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: registrada_em
                  type: TIMESTAMP
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: sangria

  - changeSet:
      id: 014-02-foreign-key-sangria-sessao-caixa
      author: extensao-restaurante-2026
      comment: Liga a sangria a sessao de caixa em que foi registrada.
      changes:
        - addForeignKeyConstraint:
            baseTableName: sangria
            baseColumnNames: sessao_caixa_id
            referencedTableName: sessao_caixa
            referencedColumnNames: id
            constraintName: fk_sangria_sessao_caixa
            onDelete: RESTRICT
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: sangria
            constraintName: fk_sangria_sessao_caixa

  - changeSet:
      id: 014-03-foreign-key-sangria-usuario
      author: extensao-restaurante-2026
      comment: Liga a sangria ao usuario que a registrou.
      changes:
        - addForeignKeyConstraint:
            baseTableName: sangria
            baseColumnNames: usuario_id
            referencedTableName: usuario
            referencedColumnNames: id
            constraintName: fk_sangria_usuario
            onDelete: RESTRICT
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: sangria
            constraintName: fk_sangria_usuario

  - changeSet:
      id: 014-04-check-sangria-valor
      author: extensao-restaurante-2026
      comment: Impede valor de sangria menor ou igual a zero inclusive fora da aplicacao Java.
      changes:
        - sql:
            sql: >
              ALTER TABLE sangria
              ADD CONSTRAINT ck_sangria_valor
              CHECK (valor > 0)
      rollback:
        - sql:
            sql: >
              ALTER TABLE sangria
              DROP CONSTRAINT ck_sangria_valor
