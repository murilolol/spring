databaseChangeLog:
  - changeSet:
      id: 001-01-create-categoria-produto
      author: curso-spring-2026
      comment: Cria a tabela que classifica os produtos do cardapio.
      changes:
        - createTable:
            tableName: categoria_produto
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_categoria_produto
                    nullable: false
              - column:
                  name: nome
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: categoria_produto

  - changeSet:
      id: 001-02-check-status-categoria-produto
      author: curso-spring-2026
      comment: Restringe o status aos valores definidos no enum Java.
      changes:
        - sql:
            sql: >
              ALTER TABLE categoria_produto
              ADD CONSTRAINT ck_categoria_produto_status
              CHECK (status IN ('ATIVO', 'INATIVO'))
      rollback:
        - sql:
            sql: >
              ALTER TABLE categoria_produto
              DROP CONSTRAINT ck_categoria_produto_status
