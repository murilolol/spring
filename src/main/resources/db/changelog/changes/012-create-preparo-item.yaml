databaseChangeLog:
  - changeSet:
      id: 012-01-create-preparo-item
      author: extensao-restaurante-2026
      comment: Cria a tabela que representa a fila de preparo da cozinha, um registro por item de pedido.
      changes:
        - createTable:
            tableName: preparo_item
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_preparo_item
                    nullable: false
              - column:
                  name: item_pedido_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: secao
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: prioridade
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: tempo_estimado_minutos
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: usuario_responsavel_id
                  type: BIGINT
              - column:
                  name: enfileirado_em
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: iniciado_em
                  type: TIMESTAMP
              - column:
                  name: concluido_em
                  type: TIMESTAMP
              - column:
                  name: cancelado_em
                  type: TIMESTAMP
      rollback:
        - dropTable:
            tableName: preparo_item

  - changeSet:
      id: 012-02-unique-preparo-item-item-pedido
      author: extensao-restaurante-2026
      comment: Garante no maximo um registro de preparo por item de pedido.
      changes:
        - addUniqueConstraint:
            tableName: preparo_item
            columnNames: item_pedido_id
            constraintName: uk_preparo_item_item_pedido
      rollback:
        - dropUniqueConstraint:
            tableName: preparo_item
            constraintName: uk_preparo_item_item_pedido

  - changeSet:
      id: 012-03-foreign-key-preparo-item-item-pedido
      author: extensao-restaurante-2026
      comment: Liga o item de preparo ao item de pedido, em cascata pois faz parte do mesmo agregado.
      changes:
        - addForeignKeyConstraint:
            baseTableName: preparo_item
            baseColumnNames: item_pedido_id
            referencedTableName: item_pedido
            referencedColumnNames: id
            constraintName: fk_preparo_item_item_pedido
            onDelete: CASCADE
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: preparo_item
            constraintName: fk_preparo_item_item_pedido

  - changeSet:
      id: 012-04-foreign-key-preparo-item-usuario-responsavel
      author: extensao-restaurante-2026
      comment: Liga o item de preparo ao cozinheiro responsavel, quando iniciado.
      changes:
        - addForeignKeyConstraint:
            baseTableName: preparo_item
            baseColumnNames: usuario_responsavel_id
            referencedTableName: usuario
            referencedColumnNames: id
            constraintName: fk_preparo_item_usuario_responsavel
            onDelete: RESTRICT
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: preparo_item
            constraintName: fk_preparo_item_usuario_responsavel

  - changeSet:
      id: 012-05-check-preparo-item-secao
      author: extensao-restaurante-2026
      comment: Restringe a secao aos valores definidos no enum Java.
      changes:
        - sql:
            sql: >
              ALTER TABLE preparo_item
              ADD CONSTRAINT ck_preparo_item_secao
              CHECK (secao IN ('COZINHA', 'BAR', 'SOBREMESA'))
      rollback:
        - sql:
            sql: >
              ALTER TABLE preparo_item
              DROP CONSTRAINT ck_preparo_item_secao

  - changeSet:
      id: 012-06-check-preparo-item-status
      author: extensao-restaurante-2026
      comment: Restringe o status aos valores definidos no enum Java.
      changes:
        - sql:
            sql: >
              ALTER TABLE preparo_item
              ADD CONSTRAINT ck_preparo_item_status
              CHECK (status IN ('AGUARDANDO', 'EM_PREPARO', 'CONCLUIDO', 'CANCELADO'))
      rollback:
        - sql:
            sql: >
              ALTER TABLE preparo_item
              DROP CONSTRAINT ck_preparo_item_status

  - changeSet:
      id: 012-07-check-preparo-item-prioridade
      author: extensao-restaurante-2026
      comment: Restringe a prioridade aos valores definidos no enum Java.
      changes:
        - sql:
            sql: >
              ALTER TABLE preparo_item
              ADD CONSTRAINT ck_preparo_item_prioridade
              CHECK (prioridade IN ('NORMAL', 'ALTA', 'URGENTE'))
      rollback:
        - sql:
            sql: >
              ALTER TABLE preparo_item
              DROP CONSTRAINT ck_preparo_item_prioridade

  - changeSet:
      id: 012-08-check-preparo-item-tempo-estimado
      author: extensao-restaurante-2026
      comment: Impede tempo estimado negativo inclusive fora da aplicacao Java.
      changes:
        - sql:
            sql: >
              ALTER TABLE preparo_item
              ADD CONSTRAINT ck_preparo_item_tempo_estimado
              CHECK (tempo_estimado_minutos >= 0)
      rollback:
        - sql:
            sql: >
              ALTER TABLE preparo_item
              DROP CONSTRAINT ck_preparo_item_tempo_estimado
