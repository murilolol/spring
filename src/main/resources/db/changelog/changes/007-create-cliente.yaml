databaseChangeLog:
  - changeSet:
      id: 007-01-create-cliente
      author: extensao-restaurante-2026
      comment: Cria a tabela de clientes do restaurante.
      changes:
        - createTable:
            tableName: cliente
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_cliente
                    nullable: false
              - column:
                  name: nome
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: documento
                  type: VARCHAR(14)
              - column:
                  name: telefone
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(150)
              - column:
                  name: endereco
                  type: VARCHAR(200)
              - column:
                  name: data_nascimento
                  type: DATE
              - column:
                  name: data_cadastro
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: cliente

  - changeSet:
      id: 007-02-unique-cliente-documento
      author: extensao-restaurante-2026
      comment: Impede documentos duplicados, permitindo varios clientes sem documento informado.
      changes:
        - sql:
            sql: >
              CREATE UNIQUE INDEX uk_cliente_documento
              ON cliente (documento)
              WHERE documento IS NOT NULL
      rollback:
        - sql:
            sql: >
              DROP INDEX uk_cliente_documento

  - changeSet:
      id: 007-03-check-status-cliente
      author: extensao-restaurante-2026
      comment: Restringe o status aos valores definidos no enum Java.
      changes:
        - sql:
            sql: >
              ALTER TABLE cliente
              ADD CONSTRAINT ck_cliente_status
              CHECK (status IN ('ATIVO', 'INATIVO'))
      rollback:
        - sql:
            sql: >
              ALTER TABLE cliente
              DROP CONSTRAINT ck_cliente_status
