databaseChangeLog:
  - changeSet:
      id: 003-01-create-usuario
      author: extensao-restaurante-2026
      comment: Cria a tabela de usuarios do sistema (garcom, cozinha, caixa, admin).
      changes:
        - createTable:
            tableName: usuario
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_usuario
                    nullable: false
              - column:
                  name: nome
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: username
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: senha_hash
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: perfil
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: criado_em
                  type: TIMESTAMP
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: usuario

  - changeSet:
      id: 003-02-unique-usuario-username
      author: extensao-restaurante-2026
      comment: Impede usernames duplicados.
      changes:
        - addUniqueConstraint:
            tableName: usuario
            columnNames: username
            constraintName: uk_usuario_username
      rollback:
        - dropUniqueConstraint:
            tableName: usuario
            constraintName: uk_usuario_username

  - changeSet:
      id: 003-03-check-perfil-usuario
      author: extensao-restaurante-2026
      comment: Restringe o perfil aos valores definidos no enum Java.
      changes:
        - sql:
            sql: >
              ALTER TABLE usuario
              ADD CONSTRAINT ck_usuario_perfil
              CHECK (perfil IN ('ADMIN', 'GARCOM', 'COZINHA', 'CAIXA'))
      rollback:
        - sql:
            sql: >
              ALTER TABLE usuario
              DROP CONSTRAINT ck_usuario_perfil

  - changeSet:
      id: 003-04-check-status-usuario
      author: extensao-restaurante-2026
      comment: Restringe o status aos valores definidos no enum Java.
      changes:
        - sql:
            sql: >
              ALTER TABLE usuario
              ADD CONSTRAINT ck_usuario_status
              CHECK (status IN ('ATIVO', 'INATIVO'))
      rollback:
        - sql:
            sql: >
              ALTER TABLE usuario
              DROP CONSTRAINT ck_usuario_status
