databaseChangeLog:
  - changeSet:
      id: 004-01-drop-produto
      author: extensao-restaurante-2026
      comment: Remove a tabela de produto da Aula 04, substituida pelo cardapio do tema de restaurante.
      changes:
        - dropTable:
            tableName: produto
      rollback:
        - createTable:
            tableName: produto
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_produto
                    nullable: false
              - column:
                  name: codigo
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: descricao
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: saldo_estoque
                  type: NUMERIC(18,3)
                  constraints:
                    nullable: false
              - column:
                  name: valor_unitario
                  type: NUMERIC(18,2)
                  constraints:
                    nullable: false
              - column:
                  name: data_cadastro
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: categoria_produto_id
                  type: BIGINT
                  constraints:
                    nullable: false

  - changeSet:
      id: 004-02-drop-categoria-produto
      author: extensao-restaurante-2026
      comment: Remove a tabela de categoria_produto da Aula 04, substituida pela categoria_cardapio.
      changes:
        - dropTable:
            tableName: categoria_produto
      rollback:
        - createTable:
            tableName: categoria_produto
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_categoria_produto
                    nullable: false
              - column:
                  name: nome
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
